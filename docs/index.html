<script>
  // Sin consola en el móvil: si algo falla, que se vea en pantalla.
  function mostrarError(m) {
    var d = document.getElementById("error-global");
    if (!d) { d = document.createElement("div"); d.id = "error-global"; document.body.appendChild(d); }
    d.textContent = "Algo ha fallado: " + m + " — toca para cerrar";
    d.onclick = function () { d.remove(); };
  }
  addEventListener("error", function (e) { if (e.message) mostrarError(e.message); });
  addEventListener("unhandledrejection", function (e) { mostrarError((e.reason && e.reason.message) || String(e.reason)); });
</script>
</head>
<body>
  <!-- Copia exacta de la pantalla de carga de iOS; al tener datos se "sella" y se va -->
  <div id="arranque" aria-hidden="true">
    <img class="arranque-sello" src="icons/sello.png" alt="">
    <span class="arranque-nombre">Matrícula</span>
  </div>

  <div id="app">
    <main id="vistas">
      <section id="vista-hoy" class="vista activa" aria-label="Hoy"></section>
      <section id="vista-calendario" class="vista" aria-label="Calendario" hidden></section>
      <section id="vista-foco" class="vista" aria-label="Foco" hidden></section>
      <section id="vista-asignaturas" class="vista" aria-label="Asignaturas" hidden></section>
      <section id="vista-ajustes" class="vista" aria-label="Ajustes" hidden></section>
    </main>
    <nav id="pestanas" role="tablist" aria-label="Secciones"></nav>
  </div>
  <div id="avisos" aria-live="polite"></div>

  <script type="module" src="js/app.js?v=1"></script>
